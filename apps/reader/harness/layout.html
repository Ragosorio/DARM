<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DARM layout harness</title>
    <style>
      html, body { margin: 0; background: #2a2927; color: #ddd; font: 12px/1.5 ui-monospace, Menlo, monospace; }
      #info { padding: 10px 14px; white-space: pre-wrap; border-bottom: 1px solid #444; }
      #grid { display: flex; flex-direction: column; gap: 18px; padding: 18px; align-items: flex-start; }
      .row { display: flex; gap: 2px; align-items: flex-start; }
      .row.single { gap: 18px; flex-wrap: wrap; }
      .cell { display: flex; flex-direction: column; gap: 4px; }
      .cell canvas { display: block; box-shadow: 0 2px 14px rgba(0, 0, 0, 0.5); }
      .cell .label { color: #aaa; max-width: 560px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .gap { width: 16px; }
    </style>
  </head>
  <body>
    <div id="info">loading…</div>
    <div id="grid"></div>
    <script type="module" src="./layout.ts"></script>
  </body>
</html>
