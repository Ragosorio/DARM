[package]
name = "darm-desktop"
version = "0.1.0"
description = "DARM reader: native shell (Tauri 2) around the web reader"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
authors = ["The DARM contributors"]
publish = false

# This crate is deliberately its own workspace (the repository root excludes
# it), so `cargo test` at the root never builds a webview stack.
[workspace]

[lib]
# `staticlib` and `cdylib` are what the iOS and Android projects link against;
# `rlib` is what the desktop binary and the unit tests use.
name = "darm_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "darm-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.5", features = [] }

[dependencies]
tauri = { version = "=2.12.6", features = [] }
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-opener = "=2.7.3"
serde = { version = "1", features = ["derive"] }
getrandom = "0.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "=2.5.5"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 4
strip = true
# Unwinding is kept on purpose: a panic inside one command must not take the
# whole reader (and the book the user has open) down with it.

[profile.dev]
debug = "line-tables-only"
